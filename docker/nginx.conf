# 前端静态站 + /api 反代。
#
# HTTP/2：浏览器只在 TLS 上使用 h2，本配置默认仅监听 80（h1.1）。生产环境请在前置 LB / Caddy / Traefik
# 终结 TLS 并对客户端启用 h2，或在此处补充：
#     listen 443 ssl;
#     http2 on;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
# 构建产物已按三层分包收敛请求数，h1.1 下也可用，但 h2 仍能进一步降低多请求页面的排队时延。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── 安全响应头 ─────────────────────────────────────────────────────────
    # nginx 的 add_header 不跨层级继承：任何自带 add_header 的 location 都必须重复这两行。
    # 内容安全策略（script-src 等）由构建期注入 SPA 入口的 <meta http-equiv="Content-Security-Policy">
    # 承担；这里只补 meta 表达不了的帧保护（frame-ancestors / X-Frame-Options）。
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # ─── 压缩 ──────────────────────────────────────────────────────────────
    # 构建期已为 js / css / svg / json 生成 .gz（level 9）与 .br（quality 11），见 packages/web/scripts/precompress.mjs。
    # gzip_static 直接下发预压缩文件：压缩率优于动态 gzip 且零 CPU；未预压缩的响应（API 反代等）走动态 gzip。
    # brotli 需要带 ngx_brotli 模块的镜像（官方 nginx:alpine 不含），可用时补充：
    #     brotli on; brotli_static on; brotli_comp_level 6;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/wasm
        font/woff2
        image/svg+xml;

    # ─── Proxy API & WebSocket to backend ──────────────────────────────────
    # Covers /api/ws (WebSocket) and all other /api/* routes.
    # Setting Connection: upgrade is harmless for regular HTTP requests and
    # required for WebSocket handshake.
    location /api {
        proxy_pass         http://api:3300;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }


    # ─── Mastra Studio(静态 SPA,/studio 子路径) ──────────────────────────
    # 数据面走同源 /api/mastra(上方 /api 反代已覆盖),鉴权由 API 侧强制。
    # /studio/refresh-events 是 Studio 内置的 dev 热重载探测,静态部署无此服务,
    # 返回 204 消音避免 EventSource 反复重试打日志。
    location = /studio/refresh-events {
        return 204;
    }
    location /studio/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ /studio/index.html;
    }
    location = /studio {
        return 301 /studio/;
    }

    # ─── SPA fallback (React Router) ───────────────────────────────────────
    #
    # 如需支持 basename（如 /admin/），取消下面注释并注释掉默认的 root fallback：
    # ─────────────────────────────────────────────────────────────────────────
    # location /admin/ {
    #     try_files $uri $uri/ /admin/index.html;
    # }
    # location = /admin {
    #     return 301 /admin/;
    # }
    # ─────────────────────────────────────────────────────────────────────────
    # 公开仪表盘（报表嵌入）允许第三方站点 iframe 嵌入：不下发帧保护头，嵌入来源由应用按仪表盘
    # embed.allowedOrigins 校验（见 docs/report/embed）。其余页面继承 server 级帧保护。
    location ^~ /public/report/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # 在本 location 内直接改写到入口文件并响应（break），不做内部跳转：
        # 内部跳转会落入 /index.html 的 location 并带上帧保护头，第三方站点将无法内嵌
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── HTML 入口：禁止启发式缓存 + 规范化 /index(.html) ────────────────────
    # 入口引用带哈希的 chunk，发版后旧 HTML 会指向已删除的文件（白屏）。no-cache 仍允许缓存但每次必须回源校验。
    #
    # 客户端显式请求 /index 或 /index.html 时 301 到 /；判定必须用 $request_uri（原始请求行）：
    # try_files / index 的回落是对 /index.html 的内部跳转，用 location 正则匹配 URI 会把每个 / 与 SPA 路由
    # 都送进 301，形成 / → / 的重定向死循环。
    location = /index.html {
        if ($request_uri ~ ^/index(\.html)?(\?.*)?$) {
            return 301 /;
        }
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri /index.html;
    }

    # ─── Long-term cache for hashed static assets ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }
}
